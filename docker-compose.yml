version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be provided through the environment}
      - DB_NAME=database.sqlite
      # If using Postgres:
      # - DB_HOST=db
      # - DB_USER=${DB_USER:?DB_USER must be provided through the environment}
      # - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be provided through the environment}
    volumes:
      - ./backend/db:/app/db # Persist SQLite DB
      - ./backend/logs:/app/logs
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
  # ... seus outros serviços (backend, frontend)

  attacker:
    image: kalilinux/kali-rolling
    container_name: cerne-kali
    tty: true
    stdin_open: true
    networks:
      - default # Garante que ele está na mesma rede que o back e o front
    volumes:
      - ./kali_scripts:/root/scripts # Uma pasta no seu Mac para salvar seus scripts de ataque

#  db: # Postgres (disabled for now as req is to keep SQLite, but ready for switch)
#    image: postgres:15
#    environment:
#      POSTGRES_USER: ${DB_USER:?DB_USER must be provided through the environment}
#      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided through the environment}
#      POSTGRES_DB: cerne_db
#    ports:
#      - "5432:5432"
#    volumes:
#      - pgdata:/var/lib/postgresql/data

